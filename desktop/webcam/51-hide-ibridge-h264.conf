# WirePlumber: hide the raw T1 camera (H.264 only, unusable by most apps) so
# PipeWire apps only offer the decoded "FaceTime HD" virtual camera.
monitor.v4l2.rules = [
  {
    matches = [
      { api.v4l2.cap.card = "iBridge" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]
