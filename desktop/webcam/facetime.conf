# v4l2-relayd instance for the T1 FaceTime HD camera, which only streams
# H.264: decode it to raw video for every app. The camera (and its green
# light) is on only while an app uses the virtual device. Decoding runs on
# the Intel GPU (VA-API, gstreamer1.0-plugins-bad + intel-media-va-driver):
# about 12% of a core instead of 52% in software. Software fallback:
#   ... ! avdec_h264 max-threads=1 ! videoconvert
VIDEOSRC="v4l2src device=/dev/v4l/by-id/usb-Apple_Inc._iBridge-video-index0 ! video/x-h264,width=1280,height=720,framerate=30/1 ! h264parse ! vah264dec ! videoconvert"
# The built-in splash needs dataurisrc (gst-plugins-bad, not installed).
SPLASHSRC="videotestsrc pattern=black num-buffers=2 ! videoconvert"
FORMAT=YUY2
WIDTH=1280
HEIGHT=720
FRAMERATE=30/1
CARD_LABEL="FaceTime HD"
