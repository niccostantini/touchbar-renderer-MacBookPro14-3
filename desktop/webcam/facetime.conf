# v4l2-relayd instance for the T1 FaceTime HD camera, which only streams
# H.264: decode it to raw video for every app. The camera (and its green
# light) is on only while an app uses the virtual device.
VIDEOSRC="v4l2src device=/dev/v4l/by-id/usb-Apple_Inc._iBridge-video-index0 ! video/x-h264,width=1280,height=720,framerate=30/1 ! avdec_h264 ! videoconvert"
FORMAT=YUY2
WIDTH=1280
HEIGHT=720
FRAMERATE=30/1
CARD_LABEL="FaceTime HD"
