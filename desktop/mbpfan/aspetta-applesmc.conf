# mbpfan parte prima che applesmc sia pronto (~40 s dall'avvio su questo Mac)
# e si arrende. Lo facciamo aspettare fino a 90 s.
# Installa: sudo install -Dm644 desktop/mbpfan/aspetta-applesmc.conf /etc/systemd/system/mbpfan.service.d/aspetta-applesmc.conf
# Rimuovi:  sudo rm -r /etc/systemd/system/mbpfan.service.d && sudo systemctl daemon-reload
[Service]
ExecStartPre=-/usr/sbin/modprobe applesmc
ExecStartPre=/bin/sh -c 'i=0; while [ ! -e /sys/devices/platform/applesmc.768/fan1_input ]; do i=$((i+1)); [ $i -ge 90 ] && exit 1; sleep 1; done'
TimeoutStartSec=120
RestartSec=5
