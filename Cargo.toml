[package]
name = "touchbar-renderer"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Touch Bar renderer for t1bridge with macOS-style volume and brightness sliders"
publish = false

[dependencies]
fontdue = "0.9"
serde_json = "1"
t1-platform = { path = "../t1bridge/crates/t1-platform", default-features = false, features = ["frame-memfd", "seqpacket"] }
t1-touchbar = { path = "../t1bridge/crates/t1-touchbar" }
t1-touchbar-hw = { path = "../t1bridge/crates/t1-touchbar-hw", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
panic = "abort"
